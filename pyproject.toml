[project]
name = "tfm-bo-materials"
version = "0.1.0"
description = "Out-of-the-box tabular foundation models for Bayesian optimization in materials discovery"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Floors are the versions the reported runs used. An older BoTorch changes the
# GP defaults, and TabPFN's default checkpoint depends on the installed version.
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "pandas>=2.3",
    "matplotlib>=3.10",
    "scikit-learn>=1.7",
    "torch>=2.2",
    "botorch>=0.16",
    "gpytorch>=1.15",
    "tabpfn>=8.1",
    "tabicl>=2.1",
    "catboost>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
